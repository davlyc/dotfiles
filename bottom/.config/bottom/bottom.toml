ram_color = "#ff8c00"          # Orange
swap_color = "#ff757f"         # Coral
rx_color = "#73daca"           # Mint
tx_color = "#ff8c00"           # Orange
border_color = "#4d4d4d"       # Grey
highlighted_border_color = "#ff8c00" # Orange
text_color = "#f8d2a6"         # Peach
graph_color = "#f8d2a6"        # Peach
cursor_color = "#ff8c00"       # Orange
